name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (tests + coverage/contract gates)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm test` includes the golden config-contract fixture (configContracts.test.js) and the
      # class-coverage ratchet (coverage-ratchet.test.js) — a malformed config or a mechanization
      # regression fails here.
      - run: npm test

  backend:
    name: Backend (pytest + feat-coverage gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dnd_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # conftest.py rewrites 'dnd_app_dev' → 'dnd_app_test', so tests hit the service DB above.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dnd_app_dev
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest
      # Feat-coverage gate. Uses a seeded DB, so it runs against a fresh dnd_app_dev built here
      # (pytest uses the separate dnd_app_test schema and does not seed feats).
      - name: Feat coverage gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dnd_app_dev
        run: |
          # Create the DB via psycopg2 (already a dependency) rather than the `createdb` binary,
          # which is not guaranteed to be on the runner image.
          python - <<'PY'
          import psycopg2
          from psycopg2 import errors
          conn = psycopg2.connect("postgresql://postgres:postgres@localhost:5432/postgres")
          conn.autocommit = True
          try:
              conn.cursor().execute("CREATE DATABASE dnd_app_dev")
          except errors.DuplicateDatabase:
              pass
          PY
          # Also the from-scratch migration gate: the chain must upgrade cleanly on an empty DB.
          alembic upgrade head
          python seed_feats.py
          python report_feat_effects.py --check
